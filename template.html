<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trofeo Ovalmo</title>
<meta name="description" content="__OG__">
<meta name="theme-color" content="#EDF0EC" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0C1310" media="(prefers-color-scheme:dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Trofeo Ovalmo">
<meta property="og:title" content="Trofeo Ovalmo">
<meta property="og:description" content="__OG__">
<meta property="og:url" content="__URL__">
<meta property="og:image" content="__URL__palladino.jpg">
<meta name="twitter:card" content="summary">
<link rel="canonical" href="__URL__">
<link rel="icon" href="palladino-64.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="palladino-180.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#EDF0EC; --card:#FFFFFF; --ink:#101B17; --ink2:#3B4A43; --mute:#6D7F77;
  --line:#D4DBD6; --line2:#E4E9E5; --accent:#0F6E4C; --brass:#96701C;
  --s1:#0F6E4C; --s1b:#DAECE2; --sx:#6F5F1C; --sxb:#ECE7D2; --s2:#255579; --s2b:#D8E5EF;
  --pk3:#DAECE2; --pk2:#F2ECD9; --pkline:#C9D6CF;
  --gr1:#2a78d6; --gr2:#eb6834; --gr3:#1baf7a; --gr4:#eda100; --gr5:#e87ba4;
  --shadow:0 1px 2px rgba(16,27,23,.05), 0 10px 24px -16px rgba(16,27,23,.25);
  --ff-d:"Barlow Condensed","Haettenschweiler","Arial Narrow",sans-serif;
  --ff-b:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --ff-m:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C1310; --card:#151E1A; --ink:#E5ECE8; --ink2:#B2C1B9; --mute:#81948A;
  --line:#26332D; --line2:#1E2924; --accent:#48AC81; --brass:#D0A24E;
  --s1:#5CBE93; --s1b:#15332A; --sx:#C5AC5C; --sxb:#2B2917; --s2:#80B3DD; --s2b:#16293A;
  --pk3:#15332A; --pk2:#2B2917; --pkline:#2C3A34;
  --gr1:#3987e5; --gr2:#d95926; --gr3:#199e70; --gr4:#c98500; --gr5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 24px -16px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0C1310; --card:#151E1A; --ink:#E5ECE8; --ink2:#B2C1B9; --mute:#81948A;
  --line:#26332D; --line2:#1E2924; --accent:#48AC81; --brass:#D0A24E;
  --s1:#5CBE93; --s1b:#15332A; --sx:#C5AC5C; --sxb:#2B2917; --s2:#80B3DD; --s2b:#16293A;
  --pk3:#15332A; --pk2:#2B2917; --pkline:#2C3A34;
  --gr1:#3987e5; --gr2:#d95926; --gr3:#199e70; --gr4:#c98500; --gr5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 24px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--ff-b); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px; margin:0 auto; padding:28px 18px 72px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ---------- masthead ---------- */
.mast{
  border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:6px;
  display:grid; grid-template-columns:1fr auto; column-gap:16px; align-items:center;
  grid-template-areas:"tag tag" "titolo faccia" "sub faccia";
}
.mast .tag{grid-area:tag; justify-self:start}
.mast h1{grid-area:titolo}
.mast .sub{grid-area:sub}
.faccia{
  grid-area:faccia; width:132px; height:132px; border-radius:50%; object-fit:cover;
  border:2px solid var(--brass);
}
/* sui telefoni stretti il titolo viene prima: la faccia si fa da parte */
@media (max-width:360px){ .faccia{width:104px; height:104px} }
.mast h1{
  font-family:var(--ff-d); font-weight:700; font-size:clamp(44px,13vw,86px);
  line-height:.88; letter-spacing:-.015em; margin:0; text-transform:uppercase;
  text-wrap:balance;
}
.mast .sub{
  font-family:var(--ff-m); font-size:11.5px; font-weight:500; letter-spacing:.14em;
  text-transform:uppercase; color:var(--mute); margin:10px 0 0;
}
.tag{
  display:inline-block; font-family:var(--ff-m); font-size:10.5px; font-weight:600;
  letter-spacing:.12em; text-transform:uppercase; color:var(--brass);
  border:1px solid var(--brass); border-radius:2px; padding:2px 7px; margin-bottom:14px;
}

/* ---------- sezioni ---------- */
section{margin-top:44px}
h2{
  font-family:var(--ff-d); font-weight:600; text-transform:uppercase;
  font-size:26px; letter-spacing:.02em; margin:0 0 4px;
}
.lede{color:var(--mute); font-size:14.5px; margin:0 0 18px; max-width:60ch}
.cta{
  display:inline-block; font-family:var(--ff-d); font-weight:700; font-size:19px;
  text-transform:uppercase; letter-spacing:.03em; text-decoration:none;
  color:var(--paper); background:var(--accent); border-radius:4px;
  padding:9px 20px; margin:0 0 16px;
}
.cta:hover{background:var(--ink)}
.cta-note{font-size:13px; color:var(--mute); margin:0 0 18px}

/* ---------- classifica ---------- */
.tw{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
th{
  font-family:var(--ff-m); font-size:10.5px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; color:var(--mute); text-align:left;
  padding:0 8px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
}
td{padding:12px 8px; border-bottom:1px solid var(--line2)}
th.num,th.num-pt,td.num,td.num-pt{text-align:right}
td.pos{
  font-family:var(--ff-d); font-weight:700; font-size:24px; color:var(--mute);
  width:34px; text-align:center; padding-right:0;
}
td.nome{font-weight:600; font-size:17px; white-space:nowrap}
td.num-pt{font-family:var(--ff-d); font-weight:700; font-size:26px; line-height:1}
td.num{font-family:var(--ff-m); font-size:14px; color:var(--ink2)}
tr.leader td.pos,tr.leader td.num-pt{color:var(--brass)}
tr.leader td.nome::after{
  content:"in testa"; font-family:var(--ff-m); font-size:9.5px; font-weight:600;
  letter-spacing:.1em; text-transform:uppercase; color:var(--brass);
  border:1px solid var(--brass); border-radius:2px; padding:1px 5px; margin-left:9px;
  vertical-align:2px; white-space:nowrap;
}
.attesa{font-size:15.5px; color:var(--ink2); margin:0 0 16px; max-width:60ch}
.roster{
  list-style:none; display:flex; flex-wrap:wrap; gap:8px; padding:0; margin:0;
}
.roster li{
  font-family:var(--ff-d); font-weight:600; font-size:19px; text-transform:uppercase;
  letter-spacing:.02em; background:var(--card); border:1px solid var(--line);
  border-radius:3px; padding:5px 12px;
}

/* ---------- schedina ---------- */
.matches{display:flex; flex-direction:column; gap:12px}
.match{
  background:var(--card); border:1px solid var(--line); border-radius:5px;
  padding:14px 14px 12px; box-shadow:var(--shadow);
}
.match header{display:block}
.match .meta{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin-bottom:2px;
}
.match .num{
  font-family:var(--ff-d); font-size:15px; font-weight:700; color:var(--accent);
  background:var(--s1b); border-radius:3px; padding:1px 8px; letter-spacing:.03em;
}
.match h3{
  font-family:var(--ff-d); font-weight:600; text-transform:uppercase; letter-spacing:.01em;
  font-size:23px; line-height:1.1; margin:0; text-wrap:balance;
}
.match h3 .v{color:var(--mute); font-weight:600}
.ora,.ris{font-family:var(--ff-m); font-size:12.5px; color:var(--mute); white-space:nowrap}
.ris{color:var(--ink); font-weight:600; font-size:14px; display:flex; align-items:center; gap:6px}
.ris .sg{width:22px; height:19px; font-size:14px}
.unan{
  font-family:var(--ff-m); font-size:10.5px; font-weight:600; letter-spacing:.09em;
  text-transform:uppercase; color:var(--brass); margin:8px 0 0;
}
.picks{
  display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:12px;
  padding-top:12px; border-top:1px dashed var(--pkline);
}
.pick{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:8px 2px 7px; border-radius:4px; background:transparent; position:relative;
}
.pick.pk3{background:var(--pk3)}
.pick.pk2{background:var(--pk2)}
.who{
  font-family:var(--ff-m); font-size:9px; font-weight:600; letter-spacing:.05em;
  text-transform:uppercase; color:var(--mute); text-align:center; line-height:1.2;
  min-height:22px; display:flex; align-items:center; justify-content:center;
}
.sc{font-family:var(--ff-m); font-size:12px; color:var(--ink2); font-variant-numeric:tabular-nums}
.pts{
  font-family:var(--ff-d); font-weight:700; font-size:15px; line-height:1;
  color:var(--mute); margin-top:1px;
}
.pick.pk3 .pts{color:var(--s1)}
.pick.pk2 .pts{color:var(--sx)}
.sg{
  font-family:var(--ff-d); font-weight:700; font-size:20px; line-height:1;
  width:30px; height:26px; display:grid; place-items:center; border-radius:3px;
}
.sg-1{color:var(--s1); background:var(--s1b)}
.sg-x{color:var(--sx); background:var(--sxb)}
.sg-2{color:var(--s2); background:var(--s2b)}
.sg-na{color:var(--mute); background:transparent}

/* ---------- regole ---------- */
.rules{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.rule{
  background:var(--card); border:1px solid var(--line); border-radius:5px; padding:13px 15px;
}
.rule b{
  display:block; font-family:var(--ff-d); font-weight:700; font-size:30px; line-height:1;
  color:var(--accent); margin-bottom:4px;
}
.rule span{font-size:14px; color:var(--ink2)}
.fine{
  margin-top:44px; padding-top:16px; border-top:1px solid var(--line);
  font-family:var(--ff-m); font-size:11px; letter-spacing:.05em; color:var(--mute);
}
@media (max-width:430px){
  .picks{gap:4px}
  .sg{width:26px; height:24px; font-size:18px}
  .sc{font-size:11px}
}

/* ---------- TBD ---------- */
.sg-tbd{
  color:var(--mute); background:transparent; border:1px dashed var(--pkline);
  font-family:var(--ff-m); font-weight:600; font-size:9.5px; letter-spacing:.06em;
}
.pick.attesa-p{opacity:.72}

/* ---------- pronostici coperti fino al calcio d'inizio ---------- */
.sg-lock{
  color:var(--accent); background:transparent; border:1px solid var(--accent);
  font-family:var(--ff-m); font-weight:700; font-size:13px; letter-spacing:0;
}
.coperto{
  margin:0 0 10px; font-family:var(--ff-m); font-size:10.5px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--accent);
}

/* ---------- punti per giornata ---------- */
.gtab{margin-top:26px}
.gtab table{width:100%}
.gtab th{padding:0 6px 7px; font-size:9px}
.gtab td{padding:9px 6px; font-family:var(--ff-m); font-size:13.5px; text-align:right}
.gtab td.g{
  font-family:var(--ff-d); font-weight:700; font-size:19px; text-align:left;
  color:var(--mute); width:42px;
}
.gtab td.re{
  font-family:var(--ff-b); font-size:12.5px; text-align:left; color:var(--brass);
  font-weight:600; white-space:nowrap;
}
.gtab td.best{color:var(--brass); font-weight:600}

/* ---------- archivio ---------- */
.arch{display:flex; flex-direction:column; gap:10px}
details.g{
  background:var(--card); border:1px solid var(--line); border-radius:5px;
  overflow:hidden;
}
details.g > summary{
  list-style:none; cursor:pointer; padding:13px 15px;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
details.g > summary::-webkit-details-marker{display:none}
details.g > summary:hover{background:var(--line2)}
summary .gname{
  font-family:var(--ff-d); font-weight:700; font-size:21px; text-transform:uppercase;
  letter-spacing:.01em;
}
summary .gre{
  font-family:var(--ff-m); font-size:10.5px; font-weight:600; letter-spacing:.07em;
  text-transform:uppercase; color:var(--brass); text-align:right; line-height:1.3;
}
summary .caret{
  font-family:var(--ff-m); font-size:13px; color:var(--mute); transition:transform .15s ease;
}
details.g[open] > summary .caret{transform:rotate(90deg)}
details.g[open] > summary{border-bottom:1px solid var(--line)}
.gbody{padding:12px 12px 14px; display:flex; flex-direction:column; gap:10px}
.gbody .match{box-shadow:none; border-color:var(--line2)}
.vuoto{color:var(--mute); font-size:14.5px; margin:0}

/* ---- andamento della classifica ---- */
.andamento .gbody{padding:14px 10px 16px}
.graf{position:relative}
#andamento{width:100%; height:auto; display:block; touch-action:pan-y}
#andamento .griglia{stroke:var(--line2); stroke-width:1}
#andamento .tacca{fill:var(--mute); font-family:var(--ff-m); font-size:11px}
#andamento .linea{fill:none; stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
#andamento .punta{stroke:var(--card); stroke-width:2}
#andamento .mirino{stroke:var(--mute); stroke-width:1; stroke-dasharray:3 3}
.bolla{
  position:absolute; top:0; transform:translateX(-50%); pointer-events:none;
  background:var(--paper); border:1px solid var(--line); border-radius:9px;
  padding:7px 10px; box-shadow:var(--shadow); font-size:12.5px; line-height:1.5;
  display:flex; flex-direction:column; white-space:nowrap}
.bolla > b{font-family:var(--ff-m); font-size:11px; color:var(--mute);
  letter-spacing:.04em; margin-bottom:3px}
.bolla span{display:flex; justify-content:space-between; gap:14px; color:var(--ink2)}
.bolla span b{color:var(--ink); font-family:var(--ff-m)}
.leg{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:12px; padding:0 4px;
  font-size:13.5px; color:var(--ink2)}
.leg .voce{display:inline-flex; align-items:center; gap:6px}
.leg i{width:10px; height:10px; border-radius:3px; display:inline-block}
.leg b{color:var(--ink); font-family:var(--ff-m); font-weight:600}

/* avviso: compare da solo se i risultati non arrivano piu' (aggiornamento fermo) */
.avviso{
  border:1px solid var(--brass); border-radius:10px; background:var(--pk2);
  color:var(--ink); padding:12px 14px; margin:0 0 18px; font-size:14.5px; line-height:1.45}
.avviso b{font-weight:600}

/* ---- modulo dei pronostici, dentro la pagina ---- */
.mod{border:1px solid var(--line); border-radius:14px; background:var(--card); padding:16px 14px; margin-top:14px}
.mod .chi{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 12px}
.mod .chi button{
  font:600 15px/1 var(--ff-s); padding:11px 14px; border-radius:10px; cursor:pointer;
  border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.mod .chi button[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.mod .cod{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.mod input[type="tel"],.mod input[type="number"]{
  font:600 16px/1 var(--ff-m); padding:10px; border-radius:9px; text-align:center;
  border:1px solid var(--line); background:var(--paper); color:var(--ink)}
.mod input[type="tel"]{width:6.5em; letter-spacing:.25em}
.mod .gol{width:3.2em}
.mod .gol2{display:flex; align-items:center; gap:6px}
.mod .tra{font:600 15px/1 var(--ff-m); color:var(--mute)}
.mod .go{
  font:700 15px/1 var(--ff-s); padding:12px 18px; border-radius:10px; cursor:pointer;
  border:0; background:var(--accent); color:#fff}
.mod .go:disabled{opacity:.5; cursor:default}
.mod .no{
  font:600 15px/1 var(--ff-s); padding:12px 18px; border-radius:10px; cursor:pointer;
  border:1px solid var(--line); background:var(--paper); color:var(--mute); margin-left:8px}
.mod .no:hover{color:var(--ink2); border-color:var(--line)}
/* codice sbagliato: il campo si scuote e diventa rosso */
.mod input.sbagliato{border-color:#c5372c; color:#c5372c; animation:scuoti .45s}
@keyframes scuoti{
  15%,85%{transform:translateX(-3px)} 30%,70%{transform:translateX(5px)}
  45%{transform:translateX(-7px)} 60%{transform:translateX(7px)} 100%{transform:translateX(0)}}

/* diretta: il pallino che dice che i numeri si stanno muovendo adesso */
.live{
  display:inline-block; font-family:var(--ff-m); font-size:11px; letter-spacing:.04em;
  color:var(--accent); margin:0 0 6px}
.live::before{content:"\25CF"; margin-right:5px; animation:pulsa 2s infinite}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.25}}
.ris .live{margin:0}
.mod .riga{
  display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center;
  padding:9px 0; border-bottom:1px solid var(--line2)}
.mod .riga:last-of-type{border-bottom:0}
.mod .riga b{font:600 15px/1.25 var(--ff-s)}
.mod .riga small{display:block; color:var(--mute); font:500 11.5px/1.4 var(--ff-m)}
.mod .tre{display:flex; gap:4px}
.mod .tre button{
  font:700 14px/1 var(--ff-m); width:38px; height:38px; border-radius:9px; cursor:pointer;
  border:1px solid var(--line); background:var(--paper); color:var(--ink2)}
.mod .tre button[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:var(--accent)}
.mod .esito{margin:12px 0 0; font:500 14px/1.5 var(--ff-s)}
.mod .mia{
  display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  padding:7px 0; border-bottom:1px solid var(--line2); font-size:14.5px}
.mod .mia:last-child{border-bottom:0}
.mod .mia b{font-family:var(--ff-m); font-weight:600; color:var(--accent)}
.mod .esito.ok{color:var(--accent)} .mod .esito.ko{color:#b3261e}
.mod .cambia{background:none; border:0; padding:0; color:var(--mute); font:500 12.5px var(--ff-s);
  text-decoration:underline; cursor:pointer}

@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div id="avviso" class="avviso" hidden></div>

  <header class="mast">
    <img class="faccia" src="palladino.jpg" width="132" height="132"
         alt="Raffaele Palladino" fetchpriority="high">
    <span class="tag">__TAG__</span>
    <h1>Trofeo<br>Ovalmo</h1>
    <p class="sub">__SUB__</p>
  </header>

  <section>
    <h2>Classifica</h2>
    <p class="lede">__LEDE__</p>
    __TABELLA__
    __ANDAMENTO__
  </section>

  __MODULO__

  <section>
    __FEATURED__
  </section>

  __ARCHIVIO__

  <p class="fine">__FINE__</p>
</div>

<script>__AVVISO__</script>
__DIRETTA__

</body>
</html>
