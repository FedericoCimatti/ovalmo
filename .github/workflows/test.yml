name: Test

# Girano a ogni modifica del codice: servono a non accorgersi di domenica
# pomeriggio che il calcolo dei punti si e' rotto.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -r requirements.txt
      - run: python -m pytest test/ -q
